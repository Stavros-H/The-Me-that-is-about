<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" href="data:,"><title>Admin Dashboard | Stavros H.</title><link rel="stylesheet" href="styles.css"></head><body><div id="site-header"></div><main class="admin-main"><section class="page-intro"><p class="eyebrow">PRIVATE AREA</p><h1>Admin<br><span>dashboard.</span></h1><p class="lede">Manage contact messages and review the current project activity.</p></section><section class="section admin-shell"><div id="admin-login" class="admin-panel"><h2>Sign in to continue</h2><p class="muted">The admin password is checked on the server and is never stored in this browser.</p><form id="login-form"><label>Admin password<input type="password" name="password" required></label><button class="button" type="submit">Sign in</button><p id="login-status" class="form-status"></p></form></div><div id="dashboard" hidden><div class="stats-grid"><div><span>Total messages</span><strong id="total-count">0</strong></div><div><span>New messages</span><strong id="new-count">0</strong></div><div><span>Replied</span><strong id="replied-count">0</strong></div><div><span>Reply rate</span><strong id="reply-rate">0%</strong></div></div><div class="dashboard-grid"><div class="admin-panel"><div class="section-heading"><h2>Messages</h2><select id="message-filter"><option value="all">All</option><option value="new">New</option><option value="replied">Replied</option></select></div><div id="messages-list"></div></div><div class="admin-panel"><h2>By reason</h2><div id="reason-chart" class="bar-chart"></div></div></div></div></section></main><div id="site-footer"></div><script src="script.js"></script><script src="admin.js"></script></body></html>
